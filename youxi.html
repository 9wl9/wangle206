<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓小球 · 街机机台版</title>
    <style>
        :root {
            --wl-bg: #FCF6DC;
            --wl-dark: #1F2330;
            --wl-darker: #14161C;
            --wl-blue: #1E66F5;
            --wl-blue-deep: #0F4CC0;
            --wl-red: #E2483D;
            --wl-red-deep: #8F1F18;
            --wl-cyan: #3DF5C6;
            --wl-yellow: #FFD54A;
            --wl-orange: #FF9F43;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body.wl_body {
            background: var(--wl-bg);
            height: 100vh;
            overflow: hidden;
            padding: 10px;
            font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            color: var(--wl-dark);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* ===== 街机机台外框 ===== */
        div.wl_cabinet {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--wl-bg);
            border: 6px solid var(--wl-dark);
            border-radius: 14px;
            box-shadow: inset 0 0 0 2px var(--wl-blue), 0 12px 32px rgba(31, 35, 48, .28);
            position: relative;
            overflow: hidden;
        }

        div.wl_cabinet::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            background: repeating-linear-gradient(0deg, rgba(31, 35, 48, .03) 0 2px, transparent 2px 5px);
        }

        div.wl_cabinet.wl_shake {
            animation: wl_shake .2s linear;
        }

        @keyframes wl_shake {
            25% {
                transform: translate(3px, -2px);
            }

            50% {
                transform: translate(-3px, 2px);
            }

            75% {
                transform: translate(2px, 1px);
            }
        }

        /* ===== 计分板顶栏 ===== */
        header.wl_topbar {
            height: 56px;
            flex: none;
            background: var(--wl-darker);
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 16px;
            z-index: 20;
            font-family: "Courier New", Consolas, monospace;
        }

        .wl_stat {
            display: flex;
            align-items: baseline;
            gap: 6px;
            white-space: nowrap;
        }

        .wl_stat small {
            font-size: 11px;
            color: #8B93A7;
            letter-spacing: 2px;
        }

        .wl_stat b {
            font-size: 24px;
            letter-spacing: 1px;
            min-width: 2ch;
        }

        #wl_score {
            color: var(--wl-cyan);
            text-shadow: 0 0 8px rgba(61, 245, 198, .55);
        }

        #wl_score.wl_minus {
            color: #FF6B5E;
            text-shadow: 0 0 8px rgba(255, 107, 94, .55);
        }

        #wl_time {
            color: var(--wl-yellow);
            text-shadow: 0 0 8px rgba(255, 213, 74, .45);
        }

        #wl_time.wl_lowtime {
            color: #FF5A4E;
            animation: wl_blink 1s steps(2) infinite;
        }

        #wl_combo {
            color: var(--wl-orange);
        }

        #wl_best {
            color: #CFD6E4;
        }

        @keyframes wl_blink {
            50% {
                opacity: .35;
            }
        }

        .wl_spacer {
            flex: 1;
        }

        header.wl_topbar a.wl_home {
            color: #fff;
            font-size: 13px;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, .5);
            padding-bottom: 1px;
        }

        header.wl_topbar a.wl_home:hover {
            border-bottom-color: #fff;
        }

        button.wl_mute {
            background: none;
            border: 1px solid rgba(255, 255, 255, .4);
            color: #fff;
            font: inherit;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        button.wl_mute:hover {
            border-color: #fff;
        }

        /* ===== 游戏区 ===== */
        main.wl_arena {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* ===== 蓝球 ===== */
        div.wl_ball {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #7FB0FF 0%, var(--wl-blue) 55%, var(--wl-blue-deep) 100%);
            box-shadow: 0 0 12px rgba(30, 102, 245, .5), 0 4px 10px rgba(31, 35, 48, .22);
            cursor: pointer;
            z-index: 10;
            display: none;
            transition: width .3s ease, height .3s ease;
            will-change: left, top;
        }

        div.wl_ball.wl_show {
            display: block;
            animation: wl_popin .18s ease-out;
        }

        @keyframes wl_popin {
            from {
                transform: scale(.3);
            }

            to {
                transform: scale(1);
            }
        }

        /* ===== 炸弹球 ===== */
        div.wl_bomb {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #FF8A7E 0%, var(--wl-red) 55%, var(--wl-red-deep) 100%);
            border: 2px solid #fff;
            box-shadow: 0 0 12px rgba(226, 72, 61, .55);
            color: #fff;
            font-weight: 900;
            font-size: 24px;
            line-height: 1;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 11;
            display: none;
            will-change: left, top;
            animation: wl_pulse 1s ease-in-out infinite;
        }

        div.wl_bomb.wl_show {
            display: flex;
        }

        @keyframes wl_pulse {
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 18px rgba(226, 72, 61, .85);
            }
        }

        /* ===== 遮罩层 ===== */
        .wl_overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 30;
            background: rgba(20, 22, 28, .72);
        }

        .wl_overlay.wl_on {
            display: flex;
        }

        .wl_card {
            background: #191C24;
            border: 2px solid var(--wl-cyan);
            box-shadow: 0 0 18px rgba(61, 245, 198, .3), 8px 8px 0 rgba(20, 22, 28, .45);
            border-radius: 10px;
            padding: 34px 42px;
            text-align: center;
            color: #EEF2F9;
            max-width: min(88vw, 440px);
        }

        h1.wl_title {
            font-family: "Courier New", Consolas, monospace;
            font-size: 34px;
            letter-spacing: 8px;
            color: var(--wl-cyan);
            text-shadow: 0 0 14px rgba(61, 245, 198, .6);
            margin-bottom: 12px;
        }

        p.wl_rule {
            font-size: 14px;
            line-height: 2;
            opacity: .88;
            margin-bottom: 22px;
        }

        span.wl_warn {
            color: #FF6B5E;
            font-weight: 700;
        }

        button.wl_bigbtn {
            font: inherit;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #fff;
            background: var(--wl-red);
            border: none;
            border-radius: 10px;
            padding: 13px 46px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--wl-red-deep);
            transition: transform .1s ease, box-shadow .1s ease;
        }

        button.wl_bigbtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--wl-red-deep);
        }

        button.wl_bigbtn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--wl-red-deep);
        }

        button.wl_bigbtn:focus-visible,
        button.wl_mute:focus-visible {
            outline: 3px solid var(--wl-yellow);
            outline-offset: 3px;
        }

        /* 结算面板 */
        p.wl_overcap {
            font-size: 13px;
            color: #8B93A7;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        #wl_finalScore {
            font-family: "Courier New", Consolas, monospace;
            font-size: 58px;
            font-weight: 700;
            color: var(--wl-cyan);
            text-shadow: 0 0 14px rgba(61, 245, 198, .55);
            line-height: 1.25;
        }

        #wl_finalScore.wl_minus {
            color: #FF6B5E;
            text-shadow: 0 0 14px rgba(255, 107, 94, .55);
        }

        p.wl_rating {
            font-size: 18px;
            margin: 6px 0 2px;
            color: var(--wl-yellow);
        }

        p.wl_substat {
            font-size: 13px;
            opacity: .65;
            margin-bottom: 20px;
        }

        span.wl_newbest {
            display: none;
            margin: 4px 0 8px;
            color: var(--wl-orange);
            font-weight: 700;
            font-size: 15px;
        }

        span.wl_newbest.wl_on {
            display: block;
        }

        /* 暂停遮罩 */
        #wl_overlay_pause {
            background: rgba(20, 22, 28, .6);
            cursor: pointer;
        }

        #wl_overlay_pause p {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--wl-cyan);
            background: #191C24;
            border: 2px solid var(--wl-cyan);
            border-radius: 10px;
            padding: 18px 34px;
            box-shadow: 0 0 14px rgba(61, 245, 198, .35);
        }

        /* ===== 喝彩词 / 漂字 / 涟漪 ===== */
        div.wl_cheer {
            position: absolute;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            font-size: clamp(36px, 8vw, 72px);
            font-weight: 900;
            color: var(--wl-blue);
            text-shadow: 3px 3px 0 rgba(255, 255, 255, .9);
            pointer-events: none;
            z-index: 40;
            animation: wl_cheerpop 1.1s ease forwards;
        }

        @keyframes wl_cheerpop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.4);
            }

            22% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.15);
            }

            38% {
                transform: translate(-50%, -50%) scale(1);
            }

            75% {
                opacity: 1;
                transform: translate(-50%, -70%) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -95%) scale(1);
            }
        }

        span.wl_float {
            position: absolute;
            font-size: 20px;
            font-weight: 700;
            pointer-events: none;
            z-index: 15;
            animation: wl_floatup .7s ease-out forwards;
        }

        span.wl_float.wl_good {
            color: var(--wl-blue);
        }

        span.wl_float.wl_bad {
            color: var(--wl-red);
        }

        @keyframes wl_floatup {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(-56px);
            }
        }

        span.wl_ripple {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            border: 3px solid;
            animation: wl_rip .45s ease-out forwards;
        }

        span.wl_ripple.wl_good {
            border-color: rgba(30, 102, 245, .55);
        }

        span.wl_ripple.wl_bad {
            border-color: rgba(226, 72, 61, .5);
        }

        span.wl_ripple.wl_boom {
            border-color: rgba(255, 143, 40, .6);
        }

        @keyframes wl_rip {
            from {
                opacity: 1;
                transform: scale(.2);
            }

            to {
                opacity: 0;
                transform: scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            span.wl_float,
            span.wl_ripple {
                display: none;
            }

            div.wl_cabinet.wl_shake,
            div.wl_bomb,
            #wl_time.wl_lowtime {
                animation: none;
            }
        }
    </style>
</head>

<body class="wl_body">
    <div class="wl_cabinet" id="wl_cabinet">
        <header class="wl_topbar" id="wl_topbar">
            <span class="wl_stat"><small>分数</small><b id="wl_score">0</b></span>
            <span class="wl_stat"><small>时间</small><b id="wl_time">2:00</b></span>
            <span class="wl_stat"><small>连击</small><b id="wl_combo">0</b></span>
            <span class="wl_stat"><small>最高</small><b id="wl_best">0</b></span>
            <span class="wl_spacer"></span>
            <a class="wl_home" href="index.html">返回首页</a>
            <button class="wl_mute" id="wl_muteBtn" type="button">音效：开</button>
        </header>

        <main class="wl_arena" id="wl_arena">
            <div class="wl_ball"></div>
            <div class="wl_ball"></div>
            <div class="wl_ball"></div>
            <div class="wl_bomb">!</div>
            <div class="wl_bomb">!</div>
        </main>

        <!-- 开始遮罩 -->
        <div class="wl_overlay wl_on" id="wl_overlay_start">
            <div class="wl_card">
                <h1 class="wl_title">抓小球</h1>
                <p class="wl_rule">
                    限时 2 分钟，3 颗蓝色小球会到处漂移。<br>
                    点中小球 <b style="color:var(--wl-cyan)">+2</b> 分，
                    点到空白 <b style="color:#FF6B5E">−1</b> 分。<br>
                    <span class="wl_warn">小心红色炸弹球！误点爆炸 −3 分。</span><br>
                    每 30 秒球会更快更小；连续命中每达 10 次会弹出夸奖词。
                </p>
                <button class="wl_bigbtn" id="wl_startBtn" type="button">开始游戏</button>
            </div>
        </div>

        <!-- 暂停遮罩 -->
        <div class="wl_overlay" id="wl_overlay_pause">
            <p>已暂停，点击继续</p>
        </div>

        <!-- 结算遮罩 -->
        <div class="wl_overlay" id="wl_overlay_over">
            <div class="wl_card">
                <p class="wl_overcap">GAME OVER · 时间到</p>
                <div id="wl_finalScore">0</div>
                <p class="wl_rating" id="wl_rating"></p>
                <span class="wl_newbest" id="wl_newbest">★ 新纪录</span>
                <p class="wl_substat" id="wl_substat"></p>
                <button class="wl_bigbtn" id="wl_againBtn" type="button">再来一局</button>
            </div>
        </div>
    </div>

    <script>
        /* ===== 常量与状态 ===== */
        const wl_TIERS = [
            { speed: 120, size: 52 },
            { speed: 150, size: 44 },
            { speed: 180, size: 38 },
            { speed: 210, size: 32 }
        ];
        const wl_DURATION = 120000;      /* 2 分钟，毫秒 */
        const wl_BOMB_SIZE = 48;
        const wl_BOMB_RATIO = 0.8;       /* 炸弹速度 = 蓝球 ×0.8 */
        const wl_WORDS = ['完美！', '太棒了！', '厉害！', '无懈可击！', '超神！'];
        const wl_RATINGS = [
            { min: 100, text: '小球猎手' },
            { min: 50, text: '身手不凡' },
            { min: 0, text: '渐入佳境' },
            { min: -Infinity, text: '小球在嘲笑你' }
        ];

        const wl_cabinet = document.getElementById('wl_cabinet');
        const wl_arena = document.getElementById('wl_arena');
        const wl_scoreEl = document.getElementById('wl_score');
        const wl_timeEl = document.getElementById('wl_time');
        const wl_comboEl = document.getElementById('wl_combo');
        const wl_bestEl = document.getElementById('wl_best');
        const wl_muteBtn = document.getElementById('wl_muteBtn');
        const wl_startOverlay = document.getElementById('wl_overlay_start');
        const wl_pauseOverlay = document.getElementById('wl_overlay_pause');
        const wl_overOverlay = document.getElementById('wl_overlay_over');
        const wl_ballEls = Array.from(wl_arena.querySelectorAll('.wl_ball'));
        const wl_bombEls = Array.from(wl_arena.querySelectorAll('.wl_bomb'));

        let wl_state = 'idle';           /* idle | running | paused | over */
        let wl_score = 0;
        let wl_combo = 0;
        let wl_comboMax = 0;
        let wl_endAt = 0;
        let wl_remainingPaused = 0;
        let wl_tier = -1;
        let wl_rafId = 0;
        let wl_lastT = 0;
        let wl_wordIndex = 0;
        let wl_speed = 120;
        let wl_size = 52;
        let wl_nextBombAt = 0;
        const wl_ballSt = wl_ballEls.map(function () { return { x: 0, y: 0, vx: 0, vy: 0, on: false }; });
        const wl_bombSt = wl_bombEls.map(function () { return { x: 0, y: 0, vx: 0, vy: 0, on: false }; });
        let wl_best = parseInt(localStorage.getItem('wl_bestScore') || '0', 10);
        let wl_muted = localStorage.getItem('wl_muted') === '1';
        wl_bestEl.textContent = wl_best;

        /* ===== 音效：Web Audio 合成 ===== */
        let wl_ctx = null;
        function wl_beep(wl_freq, wl_dur, wl_type, wl_vol, wl_endFreq) {
            if (wl_muted) return;
            if (!wl_ctx) {
                const W = window.AudioContext || window.webkitAudioContext;
                if (!W) return;
                wl_ctx = new W();
            }
            if (wl_ctx.state === 'suspended') wl_ctx.resume();
            const wl_o = wl_ctx.createOscillator();
            const wl_g = wl_ctx.createGain();
            wl_o.type = wl_type || 'sine';
            wl_o.frequency.setValueAtTime(wl_freq, wl_ctx.currentTime);
            if (wl_endFreq) wl_o.frequency.exponentialRampToValueAtTime(wl_endFreq, wl_ctx.currentTime + wl_dur);
            wl_g.gain.setValueAtTime(wl_vol || 0.12, wl_ctx.currentTime);
            wl_g.gain.exponentialRampToValueAtTime(0.0001, wl_ctx.currentTime + wl_dur);
            wl_o.connect(wl_g);
            wl_g.connect(wl_ctx.destination);
            wl_o.start();
            wl_o.stop(wl_ctx.currentTime + wl_dur);
        }
        function wl_toggleMute() {
            wl_muted = !wl_muted;
            localStorage.setItem('wl_muted', wl_muted ? '1' : '0');
            wl_muteBtn.textContent = wl_muted ? '音效：关' : '音效：开';
        }
        wl_muteBtn.textContent = wl_muted ? '音效：关' : '音效：开';
        wl_muteBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            wl_toggleMute();
        });

        /* ===== 工具 ===== */
        function wl_rand(wl_min, wl_max) {
            return wl_min + Math.random() * (wl_max - wl_min);
        }
        function wl_fmt(wl_ms) {
            const wl_s = Math.max(0, Math.ceil(wl_ms / 1000));
            return Math.floor(wl_s / 60) + ':' + String(wl_s % 60).padStart(2, '0');
        }
        function wl_syncScore() {
            wl_scoreEl.textContent = wl_score;
            wl_scoreEl.classList.toggle('wl_minus', wl_score < 0);
            wl_comboEl.textContent = wl_combo;
        }
        function wl_activeCount() {
            return wl_bombSt.filter(function (b) { return b.on; }).length;
        }
        /* 找一个与现有球/弹尽量不重叠的随机位置 */
        function wl_freePos(wl_sz) {
            const wl_w = wl_arena.clientWidth;
            const wl_h = wl_arena.clientHeight;
            const wl_takens = [];
            wl_ballSt.forEach(function (s) { if (s.on) wl_takens.push({ x: s.x, y: s.y, sz: wl_size }); });
            wl_bombSt.forEach(function (s) { if (s.on) wl_takens.push({ x: s.x, y: s.y, sz: wl_BOMB_SIZE }); });
            let wl_p = { x: 8, y: 8 };
            for (let wl_i = 0; wl_i < 12; wl_i++) {
                wl_p = {
                    x: wl_rand(8, Math.max(9, wl_w - wl_sz - 8)),
                    y: wl_rand(8, Math.max(9, wl_h - wl_sz - 8))
                };
                const wl_ok = wl_takens.every(function (t) {
                    return Math.hypot(t.x - wl_p.x, t.y - wl_p.y) > (t.sz + wl_sz) / 2 + 10;
                });
                if (wl_ok) break;
            }
            return wl_p;
        }
        function wl_randDir(wl_sp) {
            const wl_ang = Math.random() * Math.PI * 2;
            return { vx: Math.cos(wl_ang) * wl_sp, vy: Math.sin(wl_ang) * wl_sp };
        }

        /* ===== 蓝球与炸弹管理 ===== */
        function wl_place(wl_el, wl_st) {
            wl_el.style.left = wl_st.x + 'px';
            wl_el.style.top = wl_st.y + 'px';
        }
        function wl_spawnBall(wl_i) {
            const wl_st = wl_ballSt[wl_i];
            const wl_p = wl_freePos(wl_size);
            wl_st.x = wl_p.x;
            wl_st.y = wl_p.y;
            const wl_d = wl_randDir(wl_speed);
            wl_st.vx = wl_d.vx;
            wl_st.vy = wl_d.vy;
            wl_st.on = true;
            wl_ballEls[wl_i].classList.remove('wl_show');
            void wl_ballEls[wl_i].offsetWidth;   /* 重新触发弹入动画 */
            wl_ballEls[wl_i].classList.add('wl_show');
            wl_place(wl_ballEls[wl_i], wl_st);
        }
        function wl_spawnBomb() {
            const wl_i = wl_bombSt.findIndex(function (b) { return !b.on; });
            if (wl_i < 0) return;
            const wl_st = wl_bombSt[wl_i];
            const wl_p = wl_freePos(wl_BOMB_SIZE);
            wl_st.x = wl_p.x;
            wl_st.y = wl_p.y;
            const wl_d = wl_randDir(wl_speed * wl_BOMB_RATIO);
            wl_st.vx = wl_d.vx;
            wl_st.vy = wl_d.vy;
            wl_st.on = true;
            wl_bombEls[wl_i].classList.add('wl_show');
            wl_place(wl_bombEls[wl_i], wl_st);
        }
        function wl_scheduleBomb(wl_left) {
            const wl_gap = wl_left > 60000 ? wl_rand(8000, 15000) : wl_rand(5000, 9000);
            wl_nextBombAt = performance.now() + wl_gap;
        }

        /* ===== 难度档位 ===== */
        function wl_setTier(wl_i) {
            if (wl_i === wl_tier) return;
            wl_tier = wl_i;
            wl_speed = wl_TIERS[wl_i].speed;
            wl_size = wl_TIERS[wl_i].size;
            wl_ballEls.forEach(function (el) {
                el.style.width = wl_size + 'px';
                el.style.height = wl_size + 'px';
            });
            /* 保持方向，仅改速率 */
            wl_ballSt.forEach(function (s) {
                if (!s.on) return;
                const n = Math.hypot(s.vx, s.vy) || 1;
                s.vx = s.vx / n * wl_speed;
                s.vy = s.vy / n * wl_speed;
            });
            wl_bombSt.forEach(function (s) {
                if (!s.on) return;
                const n = Math.hypot(s.vx, s.vy) || 1;
                s.vx = s.vx / n * wl_speed * wl_BOMB_RATIO;
                s.vy = s.vy / n * wl_speed * wl_BOMB_RATIO;
            });
        }

        /* ===== 特效 ===== */
        function wl_ripple(wl_x, wl_y, wl_kind, wl_d) {
            const r = document.createElement('span');
            r.className = 'wl_ripple ' + wl_kind;
            r.style.width = wl_d + 'px';
            r.style.height = wl_d + 'px';
            r.style.left = (wl_x - wl_d / 2) + 'px';
            r.style.top = (wl_y - wl_d / 2) + 'px';
            wl_arena.appendChild(r);
            r.addEventListener('animationend', function () { r.remove(); });
        }
        function wl_float(wl_x, wl_y, wl_text, wl_good) {
            const f = document.createElement('span');
            f.className = 'wl_float ' + (wl_good ? 'wl_good' : 'wl_bad');
            f.textContent = wl_text;
            f.style.left = wl_x + 'px';
            f.style.top = wl_y + 'px';
            wl_arena.appendChild(f);
            f.addEventListener('animationend', function () { f.remove(); });
        }
        function wl_shake() {
            wl_cabinet.classList.remove('wl_shake');
            void wl_cabinet.offsetWidth;
            wl_cabinet.classList.add('wl_shake');
        }
        wl_cabinet.addEventListener('animationend', function (e) {
            if (e.target === wl_cabinet) wl_cabinet.classList.remove('wl_shake');
        });
        function wl_cheer() {
            const c = document.createElement('div');
            c.className = 'wl_cheer';
            c.textContent = wl_WORDS[wl_wordIndex % wl_WORDS.length];
            wl_wordIndex++;
            wl_arena.appendChild(c);
            c.addEventListener('animationend', function () { c.remove(); });
            wl_beep(880, 0.12, 'sine', 0.14);
            setTimeout(function () { wl_beep(1320, 0.18, 'sine', 0.14); }, 110);
        }

        /* ===== 计分 ===== */
        function wl_addScore(wl_n) {
            wl_score += wl_n;
            wl_syncScore();              /* 计分即时上屏 */
        }
        function wl_hitBall(e, wl_i) {
            e.stopPropagation();
            if (wl_state !== 'running') return;
            wl_addScore(2);
            wl_combo++;
            if (wl_combo > wl_comboMax) wl_comboMax = wl_combo;
            const s = wl_ballSt[wl_i];
            if (wl_combo % 10 === 0) {
                wl_cheer();              /* 十连击倍数：只弹夸奖词，不出现点击特效 */
            } else {
                wl_beep(660, 0.08, 'triangle', 0.1);
                wl_ripple(s.x + wl_size / 2, s.y + wl_size / 2, 'wl_good', 56);
                wl_float(s.x + wl_size / 2 - 14, s.y - 6, '+2', true);
            }
            wl_spawnBall(wl_i);          /* 消失并随即在随机位置重生 */
        }
        function wl_hitBomb(e, wl_i) {
            e.stopPropagation();
            if (wl_state !== 'running') return;
            const s = wl_bombSt[wl_i];
            wl_addScore(-3);
            wl_combo = 0;                /* 误点炸弹清零连击 */
            wl_beep(200, 0.35, 'sawtooth', 0.22, 45);
            wl_ripple(s.x + wl_BOMB_SIZE / 2, s.y + wl_BOMB_SIZE / 2, 'wl_boom', 64);
            wl_ripple(s.x + wl_BOMB_SIZE / 2, s.y + wl_BOMB_SIZE / 2, 'wl_boom', 104);
            wl_float(s.x + wl_BOMB_SIZE / 2 - 14, s.y - 6, '−3', false);
            wl_shake();
            s.on = false;
            wl_bombEls[wl_i].classList.remove('wl_show');
            wl_scheduleBomb(wl_endAt - performance.now());   /* 按调度重新出现 */
        }
        function wl_hitBlank(e) {
            if (wl_state !== 'running') return;
            if (e.target.closest('header.wl_topbar, button, a, .wl_overlay')) return;
            wl_addScore(-1);
            wl_combo = 0;                /* 点空白清零连击 */
            wl_beep(180, 0.12, 'square', 0.08);
            const box = wl_arena.getBoundingClientRect();
            wl_ripple(e.clientX - box.left, e.clientY - box.top, 'wl_bad', 56);
            wl_float(e.clientX - box.left - 10, e.clientY - box.top - 26, '−1', false);
        }
        wl_ballEls.forEach(function (el, i) { el.addEventListener('pointerdown', function (e) { wl_hitBall(e, i); }); });
        wl_bombEls.forEach(function (el, i) { el.addEventListener('pointerdown', function (e) { wl_hitBomb(e, i); }); });
        document.addEventListener('pointerdown', wl_hitBlank);

        /* ===== 主循环：漂移 + 倒计时 + 档位 + 炸弹调度 ===== */
        function wl_move(wl_st, wl_el, wl_sp, wl_sz) {
            wl_st.x += wl_st.vx * wl_sp;
            wl_st.y += wl_st.vy * wl_sp;
            const w = wl_arena.clientWidth - wl_sz;
            const h = wl_arena.clientHeight - wl_sz;
            if (wl_st.x <= 0) { wl_st.x = 0; wl_st.vx = Math.abs(wl_st.vx); }
            if (wl_st.x >= w) { wl_st.x = Math.max(0, w); wl_st.vx = -Math.abs(wl_st.vx); }
            if (wl_st.y <= 0) { wl_st.y = 0; wl_st.vy = Math.abs(wl_st.vy); }
            if (wl_st.y >= h) { wl_st.y = Math.max(0, h); wl_st.vy = -Math.abs(wl_st.vy); }
            wl_place(wl_el, wl_st);
        }
        function wl_loop(wl_t) {
            if (wl_state !== 'running') return;
            const dt = Math.min(0.05, (wl_t - wl_lastT) / 1000 || 0.016);
            wl_lastT = wl_t;

            wl_ballSt.forEach(function (s, i) { if (s.on) wl_move(s, wl_ballEls[i], dt, wl_size); });
            wl_bombSt.forEach(function (s, i) { if (s.on) wl_move(s, wl_bombEls[i], dt, wl_BOMB_SIZE); });

            const left = wl_endAt - performance.now();
            if (left <= 0) { wl_endGame(); return; }
            wl_setTier(left > 90000 ? 0 : left > 60000 ? 1 : left > 30000 ? 2 : 3);

            /* 炸弹调度：最多 2 颗，后期更频繁 */
            if (wl_t >= wl_nextBombAt) {
                if (wl_activeCount() < 2) wl_spawnBomb();
                wl_scheduleBomb(left);
            }

            wl_timeEl.textContent = wl_fmt(left);
            wl_timeEl.classList.toggle('wl_lowtime', left <= 10000);
            wl_rafId = requestAnimationFrame(wl_loop);
        }

        /* ===== 开始 / 结束 / 暂停 ===== */
        function wl_startGame() {
            wl_score = 0;
            wl_combo = 0;
            wl_comboMax = 0;
            wl_wordIndex = 0;
            wl_tier = -1;
            wl_speed = wl_TIERS[0].speed;
            wl_size = wl_TIERS[0].size;
            wl_ballEls.forEach(function (el) {
                el.style.width = wl_size + 'px';
                el.style.height = wl_size + 'px';
            });
            wl_bombSt.forEach(function (s, i) {
                s.on = false;
                wl_bombEls[i].classList.remove('wl_show');
            });
            wl_state = 'running';
            wl_endAt = performance.now() + wl_DURATION;
            wl_lastT = performance.now();
            wl_scheduleBomb(wl_DURATION);    /* 开局 0 颗，8–15 秒后首现 */
            wl_startOverlay.classList.remove('wl_on');
            wl_overOverlay.classList.remove('wl_on');
            for (let i = 0; i < wl_ballSt.length; i++) wl_spawnBall(i);
            wl_syncScore();
            wl_timeEl.textContent = wl_fmt(wl_DURATION);
            wl_timeEl.classList.remove('wl_lowtime');
            wl_rafId = requestAnimationFrame(wl_loop);
        }
        function wl_endGame() {
            wl_state = 'over';
            cancelAnimationFrame(wl_rafId);
            wl_ballEls.forEach(function (el) { el.classList.remove('wl_show'); });
            wl_bombEls.forEach(function (el) { el.classList.remove('wl_show'); });
            wl_bombSt.forEach(function (s) { s.on = false; });
            const isNew = wl_score > wl_best;
            if (isNew) {
                wl_best = wl_score;
                localStorage.setItem('wl_bestScore', String(wl_best));
                wl_bestEl.textContent = wl_best;
            }
            const fs = document.getElementById('wl_finalScore');
            fs.textContent = wl_score;
            fs.classList.toggle('wl_minus', wl_score < 0);
            const r = wl_RATINGS.find(function (w) { return wl_score >= w.min; });
            document.getElementById('wl_rating').textContent = '「' + r.text + '」';
            document.getElementById('wl_newbest').classList.toggle('wl_on', isNew);
            document.getElementById('wl_substat').textContent =
                '连击峰值 ' + wl_comboMax + ' ｜ 历史最高 ' + wl_best;
            wl_overOverlay.classList.add('wl_on');
            wl_beep(520, 0.4, 'sawtooth', 0.1);
        }
        function wl_pause() {
            if (wl_state !== 'running') return;
            wl_state = 'paused';
            wl_remainingPaused = wl_endAt - performance.now();
            cancelAnimationFrame(wl_rafId);
            wl_pauseOverlay.classList.add('wl_on');
        }
        function wl_resume() {
            if (wl_state !== 'paused') return;
            wl_state = 'running';
            wl_endAt = performance.now() + wl_remainingPaused;
            wl_lastT = performance.now();
            wl_pauseOverlay.classList.remove('wl_on');
            wl_rafId = requestAnimationFrame(wl_loop);
        }

        document.getElementById('wl_startBtn').addEventListener('click', function () {
            wl_beep(660, 0.1, 'triangle', 0.1);
            wl_startGame();
        });
        document.getElementById('wl_againBtn').addEventListener('click', function () {
            wl_beep(660, 0.1, 'triangle', 0.1);
            wl_startGame();
        });
        wl_pauseOverlay.addEventListener('pointerdown', wl_resume);
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) wl_pause();
        });
        window.addEventListener('resize', function () {
            if (wl_state !== 'running') return;
            const w = wl_arena.clientWidth;
            const h = wl_arena.clientHeight;
            wl_ballSt.forEach(function (s, i) {
                if (!s.on) return;
                s.x = Math.min(Math.max(s.x, 0), Math.max(0, w - wl_size));
                s.y = Math.min(Math.max(s.y, 0), Math.max(0, h - wl_size));
                wl_place(wl_ballEls[i], s);
            });
            wl_bombSt.forEach(function (s, i) {
                if (!s.on) return;
                s.x = Math.min(Math.max(s.x, 0), Math.max(0, w - wl_BOMB_SIZE));
                s.y = Math.min(Math.max(s.y, 0), Math.max(0, h - wl_BOMB_SIZE));
                wl_place(wl_bombEls[i], s);
            });
        });
    </script>
</body>
